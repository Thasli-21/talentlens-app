<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TalentLens</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TalentLens - AI Resume Screener">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TalentLens">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; color: #fafafa;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #wait img { width: 88px; height: 88px; border-radius: 20px; }
  #wait a { color: #7dd3fc; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0e1117; visibility: hidden; }
  #fb { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px; z-index: 5; opacity: .6; }
  #fb a { color: #7dd3fc; }
</style>
</head>
<body>
<div id="wait">
  <img src="icon-192.png" alt="TalentLens">
  <div><strong>TalentLens</strong><br>Starting the app... this can take up to 30 seconds.</div>
  <div><a id="direct" href="#">Not loading? Open it directly</a></div>
</div>
<div id="fb"><a id="direct2" href="#">Open directly</a></div>
<iframe id="app" title="TalentLens" allow="clipboard-write"></iframe>
<script>
  // ---- the only line you ever need to change: your Streamlit app address ----
var APP_URL = "https://thasli-resume-screener.streamlit.app";
  // ----------------------------------------------------------------------------
  var f = document.getElementById("app");
  f.addEventListener("load", function () { setTimeout(function () { f.style.visibility = "visible"; document.getElementById("fb").style.display = "none"; }, 1500); });
  f.src = APP_URL + "/?embed=true";
  document.getElementById("direct2").href = APP_URL;
  document.getElementById("direct").href = APP_URL;
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
